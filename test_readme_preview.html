<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub Profile README Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #010409;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      min-height: 100vh;
    }
    .readme-container {
      width: 100%;
      max-width: 880px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }
    .readme-header {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 14px;
    }
    .readme-header svg {
      fill: #8b949e;
    }
    .banner-link {
      display: inline-block;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
      border-radius: 8px;
      overflow: hidden;
    }
    .banner-link:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 10px 30px rgba(199, 85, 247, 0.35));
    }
    .banner-img {
      width: 100%;
      max-width: 840px;
      height: auto;
      display: block;
      border-radius: 8px;
    }
    .status-badge {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #a855f7;
    }
  </style>
</head>
<body>
  <div class="readme-container">
    <div class="readme-header">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg>
      7-Bala / README.md
    </div>
    <div align="center">
      <a href="https://7-bala.github.io/7-Bala/" class="banner-link" target="_blank" rel="noopener noreferrer">
        <img src="./banner.webp" alt="think2thrive" class="banner-img" />
      </a>
    </div>
    <div class="status-badge">
      ⚡ Click the animated banner above to launch the live interactive WebGL CRT Playground
    </div>
  </div>
</body>
</html>
